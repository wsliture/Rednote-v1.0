spring.application.name=rednote
spring.config.import=optional:file:./.env.dev.properties
spring.datasource.url=${REDNOTE_DB_URL:jdbc:mysql://127.0.0.1:3306/rednote_v1?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${REDNOTE_DB_USER:root}
spring.datasource.password=${REDNOTE_DB_PASSWORD:${rednote.dev.db.password:}}
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.transaction-isolation=TRANSACTION_REPEATABLE_READ
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
rednote.storage.root=${REDNOTE_UPLOAD_ROOT:${user.home}/.rednote/uploads}
rednote.admin.initialize=${REDNOTE_ADMIN_INITIALIZE:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
logging.pattern.level=%5p [requestId:%X{requestId}]

# Development/default: fetch static assets afresh.
spring.web.resources.cache.cachecontrol.no-store=true
