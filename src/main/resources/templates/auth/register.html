<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/shell :: head('开启你的记录之旅')}"></head>
  <body>
    <div>
      <aside th:replace="~{layouts/shell :: sidebar(false)}"></aside>
      <main class="main">
        <header th:replace="~{layouts/shell :: topbar(false)}"></header>
        <div class="content">
          <div class="auth">
            <div class="auth-art">
              <div>
                <div class="eyebrow" style="color: #fff9">
                  LIFE IS WORTH SHARING
                </div>
                <h2>把生活的美好<br />留在这里。</h2>
                <p>
                  发现真实的日常，遇见同频的灵感。<br />每一份热爱，都值得被看见。
                </p>
              </div>
            </div>
            <section class="auth-form">
              <h1>开启你的记录之旅</h1>
              <p class="muted">创建账号，分享你的生活灵感</p>
              <p class="notice" th:if="${param.registered != null}">
                注册成功，请登录。
              </p>
              <p class="notice" th:if="${param.passwordChanged != null}">
                密码修改成功，请重新登录。
              </p>
              <form method="post" th:action="@{/register}" data-auth="register">
                <input
                  type="hidden"
                  name="returnTo"
                  th:value="${param.returnTo}"
                />
                <div class="formfield">
                  <label for="username">用户名</label
                  ><input
                    id="username"
                    name="username"
                    autocomplete="username"
                    th:value="${form['username']}"
                    placeholder="4–20 位字母、数字或下划线"
                  />
                  <p
                    th:replace="~{fragments/components :: error('username')}"
                  ></p>
                </div>
                <div class="formfield">
                  <label for="password">密码</label
                  ><input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="8–32 位，包含英文字母和数字"
                  />
                  <p
                    th:replace="~{fragments/components :: error('password')}"
                  ></p>
                </div>
                <div class="formfield">
                  <label for="confirm">确认密码</label
                  ><input
                    type="password"
                    id="confirm"
                    name="confirm"
                    autocomplete="new-password"
                  />
                  <p
                    th:replace="~{fragments/components :: error('confirm')}"
                  ></p>
                </div>
                <p
                  class="error"
                  data-form-error
                  th:text="${param.error != null ? '账号或密码错误，或账号已禁用' : message}"
                ></p>
                <button class="btn primary" style="width: 100%">注册</button>
              </form>
              <p class="muted" style="margin-top: 24px">
                已有账号？<a th:href="@{/login}">去登录</a>
              </p>
            </section>
          </div>
        </div>
      </main>
      <nav th:replace="~{layouts/shell :: mobile}"></nav>
    </div>
    <th:block th:replace="~{layouts/shell :: feedback}"></th:block>
  </body>
</html>
