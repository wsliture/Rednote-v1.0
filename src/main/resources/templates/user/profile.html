<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/shell :: head('个人主页')}"></head>
  <body>
    <div>
      <aside th:replace="~{layouts/shell :: sidebar(false)}"></aside>
      <main class="main">
        <header th:replace="~{layouts/shell :: topbar(false)}"></header>
        <div class="content">
          <section class="profile profile-head">
            <span
              th:replace="~{fragments/components :: avatar(${profile})}"
            ></span>
            <div>
              <div class="eyebrow">A LITTLE ABOUT ME</div>
              <h1 th:text="${profile.name}"></h1>
              <p
                class="bodytext"
                th:text="${#strings.isEmpty(profile.bio) ? '还没有填写简介，生活的故事正在发生。' : profile.bio}"
              ></p>
              <div class="row wrap">
                <span
                  class="muted"
                  th:text="${profile.noteCount}+' 篇笔记'"
                ></span
                ><a
                  th:if="${me != null and me.id == profile.id}"
                  class="btn small"
                  th:href="@{/settings}"
                  >编辑资料</a
                ><a
                  th:if="${me != null and me.id == profile.id}"
                  class="btn primary small"
                  th:href="@{/notes/new}"
                  >发布笔记</a
                >
              </div>
            </div>
          </section>
          <div class="tabs">
            <button class="active">
              <span
                th:text="${me != null and me.id == profile.id ? '我的笔记' : 'TA 的笔记'}"
              ></span>
              <span class="badge-number" th:text="${profile.noteCount}"></span>
            </button>
          </div>
          <div class="waterfall">
            <th:block th:each="note:${pagination.items}"
              ><article
                th:replace="~{fragments/components :: card(${note})}"
              ></article
            ></th:block>
          </div>
          <th:block th:if="${#lists.isEmpty(pagination.items)}"
            ><div
              th:replace="~{fragments/components :: empty('还没有发布笔记','生活的故事正在发生。')}"
            ></div
          ></th:block>
          <nav
            th:replace="~{fragments/components :: pagination(@{/users/{id}(id=${profile.id})})}"
          ></nav>
        </div>
      </main>
      <nav th:replace="~{layouts/shell :: mobile}"></nav>
    </div>
    <th:block th:replace="~{layouts/shell :: feedback}"></th:block>
  </body>
</html>
