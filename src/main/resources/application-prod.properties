spring.datasource.url=${REDNOTE_DB_URL}
spring.datasource.username=${REDNOTE_DB_USER}
spring.datasource.password=${REDNOTE_DB_PASSWORD}
rednote.storage.root=${REDNOTE_UPLOAD_ROOT}
server.servlet.session.cookie.secure=true
spring.thymeleaf.cache=true
logging.file.name=${REDNOTE_LOG_FILE:/var/log/rednote/application.log}
logging.logback.rollingpolicy.max-history=7

# Store static assets, but revalidate every use (including ES module imports).
spring.web.resources.cache.cachecontrol.no-store=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.cache-public=true
