spring.thymeleaf.cache=false
# Local development credentials are kept outside version control.
spring.config.import=optional:file:./.env.dev.properties
spring.datasource.url=${REDNOTE_DEV_DB_URL:jdbc:mysql://127.0.0.1:3306/rednote_v1?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${REDNOTE_DEV_DB_USER:root}
spring.datasource.password=${REDNOTE_DEV_DB_PASSWORD:${rednote.dev.db.password:}}
